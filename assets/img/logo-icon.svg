<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 162" role="img" aria-label="Jade Remodeling, Inc. logo">
  <!-- flanking house outlines (green) -->
  <g fill="none" stroke="#159447" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M13 85 L46 55 L79 85"/>
    <path d="M23 81 L23 123 L69 123 L69 81"/>
    <path d="M121 85 L154 55 L187 85"/>
    <path d="M131 81 L131 123 L177 123 L177 81"/>
  </g>
  <!-- central house (indigo) -->
  <polygon points="50 79 100 33 150 79" fill="#4736A3"/>
  <rect x="65" y="77" width="70" height="57" rx="4" fill="#4736A3"/>
  <!-- crossed tools (white negative space) -->
  <g fill="#FFFFFF">
    <!-- screwdriver -->
    <g transform="rotate(-29 100 103)">
      <polygon points="95.5 60 104.5 60 100 51"/>
      <rect x="95.5" y="60" width="9" height="34" rx="2.5"/>
      <rect x="90.5" y="93" width="19" height="23" rx="4.5"/>
    </g>
    <!-- hammer -->
    <g transform="rotate(31 100 103)">
      <rect x="96.8" y="70" width="6.6" height="46" rx="2.6"/>
      <path d="M83 65 h31 a4 4 0 0 1 4 4 v10 a4 4 0 0 1 -4 4 h-10 v-6 h-21 z"/>
    </g>
  </g>
  <!-- swoosh -->
  <path d="M17 140 C 62 123 138 153 185 135" fill="none" stroke="#159447" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M17 151 C 70 135 128 164 185 147" fill="none" stroke="#4736A3" stroke-width="7.5" stroke-linecap="round"/>
</svg>
